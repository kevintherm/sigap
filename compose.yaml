# The whole Sigap stack: `docker compose up -d --build` starts Langflow, then the backend, then the public tunnel.
# All three restart on their own after a reboot (restart: unless-stopped).
services:
  langflow:
    image: ${LANGFLOW_IMAGE:-docker.io/langflowai/langflow:latest}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${HOST_PORT:-7860}:${LANGFLOW_PORT:-7860}  # localhost only: just the Sigap backend talks to Langflow
    environment:
      LANGFLOW_HOST: ${LANGFLOW_HOST:-localhost}
      LANGFLOW_PORT: ${LANGFLOW_PORT:-7860}
      LANGFLOW_CONFIG_DIR: ${LANGFLOW_CONFIG_DIR:-/app/langflow}
      LANGFLOW_DATABASE_URL: ${LANGFLOW_DATABASE_URL:-sqlite:////app/langflow/langflow.db}
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN:-true}
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-langflow}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
      LANGFLOW_SSRF_PROTECTION_ENABLED: ${LANGFLOW_SSRF_PROTECTION_ENABLED:-true}
      LANGFLOW_SSRF_ALLOWED_HOSTS: ${LANGFLOW_SSRF_ALLOWED_HOSTS}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-true}
      # Run logs copy every message's text and cannot be deleted through the API, so Sigap turns them off (UU PDP).
      # Chat messages themselves are kept for the agent's memory and deleted by the backend after 24 hours.
      LANGFLOW_TRANSACTIONS_STORAGE_ENABLED: ${LANGFLOW_TRANSACTIONS_STORAGE_ENABLED:-false}
      LANGFLOW_VERTEX_BUILDS_STORAGE_ENABLED: ${LANGFLOW_VERTEX_BUILDS_STORAGE_ENABLED:-false}
      LANGFLOW_DEACTIVATE_TRACING: ${LANGFLOW_DEACTIVATE_TRACING:-true}
    volumes:
      - langflow-data:/app/langflow:rw
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://${LANGFLOW_HOST:-localhost}:${LANGFLOW_PORT:-7860}/health_check",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${LANGFLOW_CPUS_LIMIT:-1.0}
          memory: ${LANGFLOW_MEM_LIMIT:-2g}
        reservations:
          cpus: ${LANGFLOW_CPUS_RESERVATION:-0.25}
          memory: ${LANGFLOW_MEM_RESERVATION:-256m}

  backend:
    build: .
    image: sigap-backend
    restart: unless-stopped
    depends_on:
      langflow:
        condition: service_healthy
    env_file: .env
    environment:
      LANGFLOW_URL: http://langflow:7860  # inside the compose network, not localhost
      # Sign-in links and the MCP URL use the tunnel's current address, read from cloudflared at runtime.
      SIGAP_PUBLIC_URL_FROM: http://tunnel:2000/quicktunnel
      FORWARDED_ALLOW_IPS: "*"  # trust the tunnel's X-Forwarded-Proto, so login cookies are marked Secure
    user: "${UID:-1000}:${GID:-1000}"  # database files in var/ stay owned by you
    volumes:
      - ./var:/app/var
      - ./outbox:/app/outbox
    ports:
      - 127.0.0.1:8000:8000  # admin panel, student portal and MCP gateway on this machine
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  tunnel:
    # Cloudflare quick tunnel: a public https address for the backend, new on every start. Remove this service
    # (or set SIGAP_PUBLIC_URL to your own domain) if you do not want Sigap reachable from outside.
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://backend:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  langflow-data:
