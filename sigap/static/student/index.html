<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigap Mahasiswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/static/app.css">
<style>
  .page { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top .spacer { flex: 1; }
  .card h2 { margin-bottom: 8px; }
  .notice { background: var(--info-soft); color: var(--info); border-radius: 8px; padding: 12px 16px; font-size: 14px; }
  .warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 12px 16px; font-size: 14px; }
  .code-input { font: 400 24px var(--code); letter-spacing: .4em; text-align: center; }
  .item { display: flex; gap: 8px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .item:last-child { border-bottom: 0; }
  .privacy { font-size: 14px; max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
  .privacy p { margin: 0 0 8px; } .privacy ul { margin: 0 0 8px; padding-left: 20px; }
  .big { font-size: 16px; }
  #view { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body class="dotgrid">
<div class="page">
  <div class="top"><div class="logo">S</div><div class="brand-row"><div><b>Sigap</b><span>Portal mahasiswa</span></div></div>
    <span class="spacer"></span><button class="btn ghost small" id="logout" hidden>Keluar</button></div>
  <div id="view"><p class="muted">Memuat…</p></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/student/static/app.js"></script>
</body>
</html>
